[project]
name = "divergencesplitter-runtime"
version = "0.1.0"
description = "Runtime services for DivergenceSplitter"
requires-python = ">=3.14"
dependencies = [
    "divergencesplitter",
    "livesplit-bridge-client",
]

[tool.uv.sources]
divergencesplitter = { workspace = true }
livesplit-bridge-client = { git = "https://github.com/Nanahuse/livesplit-bridge-client.git", rev = "f40f17c75e8355afd97a9bc6cf79f258721ffe0a" }

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
