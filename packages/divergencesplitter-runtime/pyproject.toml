[project]
name = "divergencesplitter-runtime"
version = "0.1.0"
description = "Runtime services for DivergenceSplitter"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "divergencesplitter",
    "livesplit-bridge-client @ git+https://github.com/Nanahuse/livesplit-bridge-client.git@v0.2.0",
    "pyyaml>=6.0",
    "windows-capture-device-list @ git+https://github.com/Nanahuse/windows-capture-device-list.git@v0.2.0 ; sys_platform == 'win32'",
]

[project.scripts]
divergencesplitter = "divergencesplitter_runtime.cli:main"

[tool.uv.sources]
divergencesplitter = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
