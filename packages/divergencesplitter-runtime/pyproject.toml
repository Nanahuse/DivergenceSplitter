[project]
name = "divergencesplitter-runtime"
version = "0.1.0"
description = "Runtime services for DivergenceSplitter"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "divergencesplitter",
    "livesplit-bridge-client",
    "pyyaml>=6.0",
    "windows-capture-device-list; sys_platform == 'win32'",
]

[project.scripts]
divergencesplitter = "divergencesplitter_runtime.cli:main"

[tool.uv.sources]
divergencesplitter = { workspace = true }
livesplit-bridge-client = { git = "https://github.com/Nanahuse/livesplit-bridge-client.git", rev = "e2a5b74f2f0e4bee43a7d30fef847f3aa42c49d5" }
windows-capture-device-list = { git = "https://github.com/Nanahuse/windows-capture-device-list.git", tag = "v0.2.0" }

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
