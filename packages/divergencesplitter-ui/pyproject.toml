[project]
name = "divergencesplitter-ui"
version = "0.1.0"
description = "Windows desktop UI for DivergenceSplitter"
requires-python = ">=3.14"
license = "MIT"
classifiers = [
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "divergencesplitter-runtime",
    "flet>=1.0,<2",
    "ndi-python>=6.3.2.4 ; sys_platform == 'win32'",
]

[project.scripts]
divergencesplitter-ui = "divergencesplitter_ui.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
divergencesplitter-runtime = { workspace = true }

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.dev_packages]
divergencesplitter-runtime = "../divergencesplitter-runtime"
divergencesplitter = "../divergencesplitter"

[tool.flet.windows]
dependencies = [
    "divergencesplitter",
]

[tool.flet.windows.compile]
packages = false

[tool.flet.windows.cleanup]
packages = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
