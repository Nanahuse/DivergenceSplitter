[project]
name = "livesplit-bridge-client"
version = "0.1.0"
description = "Typed Python client for LiveSplit.Bridge"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "protobuf>=6.33.5,<7",
    "pyzmq>=26,<28",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.81.1",
    "hatchling",
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling", "grpcio-tools==1.81.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livesplit_bridge_client"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/livesplit/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PYI"]

[tool.ty.rules]
conflicting-metaclass = "ignore"
