[project]
name = "divergencesplitter"
version = "0.1.0"
description = "Scenario authoring library for DivergenceSplitter"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
]

[project.optional-dependencies]
# NDI input is optional: the runtime and its Python binding load lazily, so
# DivergenceSplitter keeps working without this extra installed.
ndi = [
    "ndi-python>=6.3.2.4",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
