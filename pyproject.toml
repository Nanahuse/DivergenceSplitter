[project]
name = "divergencesplitter-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "divergencesplitter",
    "divergencesplitter-runtime",
]

[tool.uv]
package = false

[tool.uv.sources]
divergencesplitter = { workspace = true }
divergencesplitter-runtime = { workspace = true }
divergencesplitter-ui = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
