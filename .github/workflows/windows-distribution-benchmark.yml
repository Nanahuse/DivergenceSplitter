name: Windows distribution compression benchmark

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    name: windows-build-compression
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"

      - name: Restore Flutter and Flet cache
        uses: actions/cache@v6
        with:
          path: |
            ~/flutter/3.44.8
            ~/.flet/cache
          key: flet-build-windows-${{ runner.os }}-flet-1.0.0-flutter-3.44.8-py-3.14

      - name: Sync environment
        run: uv sync --locked --all-packages --group build --extra ndi

      - name: Check license inventory
        run: uv run --no-sync python tools/generate_ui_license_inventory.py --check

      - name: Generate UI version
        run: uv run --no-sync python tools/generate_ui_version.py

      - name: Build and verify Windows distribution
        run: uv run --no-sync python tools/build_windows_distribution.py

      - name: Record input distribution size
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem dist/windows -Recurse -File | Measure-Object Length -Sum).Sum
          "## Compression benchmark`n`nInput distribution size: $bytes bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload 7z reference
        uses: actions/upload-artifact@v7
        with:
          name: DivergenceSplitter-7z
          path: dist/DivergenceSplitter-windows-x64.7z
          archive: false
          if-no-files-found: error

      - name: Upload Artifact ZIP level 0
        uses: actions/upload-artifact@v7
        with:
          name: DivergenceSplitter-artifact-level-0
          path: dist/windows
          archive: true
          compression-level: 0
          if-no-files-found: error

      - name: Upload Artifact ZIP level 1
        uses: actions/upload-artifact@v7
        with:
          name: DivergenceSplitter-artifact-level-1
          path: dist/windows
          archive: true
          compression-level: 1
          if-no-files-found: error

      - name: Upload Artifact ZIP level 6
        uses: actions/upload-artifact@v7
        with:
          name: DivergenceSplitter-artifact-level-6
          path: dist/windows
          archive: true
          compression-level: 6
          if-no-files-found: error

      - name: Upload Artifact ZIP level 9
        uses: actions/upload-artifact@v7
        with:
          name: DivergenceSplitter-artifact-level-9
          path: dist/windows
          archive: true
          compression-level: 9
          if-no-files-found: error
