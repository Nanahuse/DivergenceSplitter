name: Core distribution

on:
  pull_request:
  push:
    branches: [main]

jobs:
  external-install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
      - name: Build core distributions without workspace sources
        run: >-
          uv build
          --no-sources
          --package divergencesplitter
          --out-dir dist/core
      - name: Verify external installation
        shell: bash
        run: |
          wheel="$(find dist/core -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run \
            --isolated \
            --no-project \
            --python 3.14 \
            --with "$wheel" \
            python tools/verify_core_distribution.py --artifacts dist/core
