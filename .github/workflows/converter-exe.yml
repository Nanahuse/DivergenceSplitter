name: AutoSplit Converter EXE

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
      - name: Sync locked environment
        run: uv sync --locked --all-packages
      - name: Build converter executable
        run: uv run pyinstaller --onefile --windowed tools/converter_entry.py --name autosplit-converter
      - name: Upload converter executable
        uses: actions/upload-artifact@v5
        with:
          name: autosplit-converter-windows
          path: dist/autosplit-converter.exe
