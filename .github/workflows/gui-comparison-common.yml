name: GUI library comparison

on:
  pull_request:
    paths:
      - 'experiments/gui-comparison/**'
      - 'tools/*gui*'
      - 'tools/tests/test_package_gui_comparison.py'
      - 'tools/tests/test_summarize_gui_comparison.py'
      - 'tools/tests/test_run_gui_comparison.py'
      - 'tools/measure_distribution.py'
      - 'tools/prepare_cpp_distribution.py'
      - '.github/workflows/gui-comparison-common.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/gui-comparison/**'
      - 'tools/*gui*'
      - '.github/workflows/gui-comparison-common.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gui:
    name: Windows x64 / ${{ matrix.candidate }} / ${{ matrix.qt_configuration }}
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        candidate: [qt, wx, imgui]
        qt_configuration: [standard]
        include:
          - candidate: qt
            qt_configuration: features
          - candidate: qt
            qt_configuration: optimized
    defaults:
      run:
        shell: pwsh
    env:
      VSLANG: '1033'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - name: Test distribution tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install pytest==9.1.1
          python -m pytest tools/tests/test_package_gui_comparison.py tools/tests/test_run_gui_comparison.py tools/tests/test_summarize_gui_comparison.py tools/tests/test_measure_distribution.py tools/tests/test_prepare_cpp_distribution.py -q --junitxml=build/gui-tool-tests.xml
      - name: Read pinned vcpkg commit
        id: manifest
        run: |
          $manifest = Get-Content experiments/gui-comparison/vcpkg.json -Raw | ConvertFrom-Json
          "baseline=$($manifest.'builtin-baseline')" >> $env:GITHUB_OUTPUT
          $variant = if ('${{ matrix.qt_configuration }}' -eq 'standard') { '${{ matrix.candidate }}' } else { 'qt-${{ matrix.qt_configuration }}' }
          "variant=$variant" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.manifest.outputs.baseline }}
          path: build/vcpkg
      - uses: actions/cache/restore@v6
        id: binary-cache
        with:
          path: .vcpkg-binary-cache
          key: gui-comparison-windows-2025-${{ steps.manifest.outputs.variant }}-${{ steps.manifest.outputs.baseline }}-${{ hashFiles('experiments/gui-comparison/vcpkg.json') }}
          restore-keys: |
            gui-comparison-windows-2025-${{ steps.manifest.outputs.variant }}-${{ steps.manifest.outputs.baseline }}-
            gui-comparison-windows-2025-${{ matrix.candidate }}-${{ steps.manifest.outputs.baseline }}-
      - name: Release build, common and GUI tests, install and extracted-ZIP tests
        id: verify
        env:
          PROBE_BINARY_CACHE_HIT: ${{ steps.binary-cache.outputs.cache-hit == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 C++ tools required.' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$vs/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin;$vs/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja;$env:PATH"
          $env:VCPKG_ROOT = (Resolve-Path build/vcpkg).Path
          New-Item -ItemType Directory -Force build/gui-comparison-reports | Out-Null
          & build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          & tools/build_gui_comparison.ps1 -Candidate '${{ matrix.candidate }}' -QtConfiguration '${{ matrix.qt_configuration }}' *>&1 | Tee-Object -FilePath 'build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}-build.log'
      - name: Preserve complete dependency cache even when a later GUI test fails
        if: always() && steps.binary-cache.outputs.cache-hit != 'true' && steps.verify.outputs.dependencies_configured == 'true'
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-binary-cache
          key: ${{ steps.binary-cache.outputs.cache-primary-key }}
      - name: Publish measured distribution and timing
        run: |
          Get-Content 'build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}/report.md' >> $env:GITHUB_STEP_SUMMARY
          '## Timings (seconds)' >> $env:GITHUB_STEP_SUMMARY
          '```json' >> $env:GITHUB_STEP_SUMMARY
          Get-Content 'build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}/timings.json' >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          'Functional CI only. CPU/memory on different hosted runners are not a performance ranking. Physical input, IME, DPI transitions and positive file selection remain unverified. NDI excluded.' >> $env:GITHUB_STEP_SUMMARY
      - name: Save distribution ZIP, reports and GUI captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-comparison-${{ steps.manifest.outputs.variant }}-windows-x64
          path: |
            build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}/*.json
            build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}/*.md
            build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}/*.csv
            build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}/*.log
            build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}/*.png
            build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}/*.zip
            build/gui-comparison-reports/${{ steps.manifest.outputs.variant }}-build.log
            build/gui-comparison/${{ steps.manifest.outputs.variant }}/*-gui.*
            build/gui-comparison/${{ steps.manifest.outputs.variant }}/*-view.*
            build/gui-comparison/${{ steps.manifest.outputs.variant }}/exit-hold.json
            build/gui-comparison/${{ steps.manifest.outputs.variant }}/gui-tests.xml
            build/gui-tool-tests.xml
          compression-level: 0
          if-no-files-found: warn
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-comparison-${{ steps.manifest.outputs.variant }}-diagnostics
          path: |
            build/gui-comparison/${{ steps.manifest.outputs.variant }}/Testing/Temporary
            build/gui-comparison/${{ steps.manifest.outputs.variant }}/CMakeFiles/CMakeConfigureLog.yaml
            build/gui-comparison/${{ steps.manifest.outputs.variant }}/vcpkg-manifest-install.log
            build/vcpkg/buildtrees/*/*.log
          if-no-files-found: ignore
