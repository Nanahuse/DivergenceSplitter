name: C++23

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-cache,readwrite
      NDI_SDK_URL_WINDOWS: ${{ secrets.NDI_SDK_URL_WINDOWS }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test distribution scripts
        run: python -m unittest discover -s tools/tests -v

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get official pinned NDI SDK for runtime integration test
        if: env.NDI_SDK_URL_WINDOWS != ''
        env:
          NDI_SDK_URL_WINDOWS: ${{ secrets.NDI_SDK_URL_WINDOWS }}
        run: python tools/get_ndi_sdk.py

      - name: Bootstrap vcpkg
        run: C:\vcpkg\bootstrap-vcpkg.bat

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg-cache
          key: cpp23-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            cpp23-vcpkg-${{ runner.os }}-

      - name: Check out LiveSplit.Bridge TestHost
        uses: actions/checkout@v5
        with:
          repository: Nanahuse/LiveSplit.Bridge
          ref: 4c14c0161eacd50b05411c0d20f5eff523e9c155
          submodules: recursive
          path: .testhost/LiveSplit.Bridge

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build TestHost
        working-directory: ${{ github.workspace }}
        run: dotnet build .testhost/LiveSplit.Bridge/tests/LiveSplit.Bridge.TestHost/LiveSplit.Bridge.TestHost.csproj --configuration Release

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Test
        run: |
          if ($env:NDI_SDK_DIR) {
            $env:NDI_RUNTIME_DIR_V6 = Join-Path $env:NDI_SDK_DIR "Bin/x64"
          }
          ctest --preset ci --output-on-failure --interactive-debug-mode 0 --output-junit ctest-results.xml

      - name: TestHost integration
        working-directory: ${{ github.workspace }}
        run: python tools/run_testhost.py --testhost .testhost/LiveSplit.Bridge/tests/LiveSplit.Bridge.TestHost/bin --test-exe build/ci/divergencesplitter_testhost_tests.exe --port 54000

      - name: Package ZIP
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "build/ci/vc_redist.x64.exe"
          cmake --build --preset ci --target package

      - name: Record ZIP size
        run: Get-ChildItem build/ci/*.zip | Select-Object Name, Length | Format-Table -AutoSize

      - name: Verify extracted ZIP
        run: python tools/verify_windows_zip.py --build-dir build/ci

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: DivergenceSplitter-cpp23-windows-x64
          path: build/ci/*.zip
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp23-tests
          path: build/ci/ctest-results.xml
          if-no-files-found: warn
