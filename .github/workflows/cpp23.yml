name: C++23

on:
  pull_request:
  push:
    branches: [main, feat/cpp-rewrite]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (NDI ${{ matrix.ndi }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # pull_request (never pull_request_target): fork code gets no SDK Secret.
        ndi: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["OFF","ON"]' || '["OFF"]') }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cpp
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v5

      - name: Get official pinned NDI SDK (no public cache)
        if: matrix.ndi == 'ON'
        shell: pwsh
        env:
          NDI_SDK_URL_WINDOWS: ${{ secrets.NDI_SDK_URL_WINDOWS }}
        run: ./tools/get_ndi_sdk.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'ndi-sdk')

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            & C:\vcpkg\bootstrap-vcpkg.bat
          }

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg-cache
          key: cpp23-vcpkg-${{ runner.os }}-${{ hashFiles('cpp/vcpkg.json') }}
          restore-keys: |
            cpp23-vcpkg-${{ runner.os }}-

      - name: Check out LiveSplit.Bridge TestHost
        uses: actions/checkout@v5
        with:
          repository: Nanahuse/LiveSplit.Bridge
          ref: 4c14c0161eacd50b05411c0d20f5eff523e9c155
          submodules: recursive
          path: .testhost/LiveSplit.Bridge

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python for TestHost runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build TestHost
        working-directory: ${{ github.workspace }}
        run: dotnet build .testhost/LiveSplit.Bridge/tests/LiveSplit.Bridge.TestHost/LiveSplit.Bridge.TestHost.csproj --configuration Release

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset ci -DDIVERGENCESPLITTER_ENABLE_NDI=${{ matrix.ndi }} "-DNDI_SDK_DIR=$env:NDI_SDK_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CMake Configure failed' }

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Test
        run: ctest --preset ci --output-on-failure --interactive-debug-mode 0 --output-junit ctest-results.xml

      - name: TestHost integration
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $testhost = Get-ChildItem '.testhost/LiveSplit.Bridge/tests/LiveSplit.Bridge.TestHost/bin' -Recurse -Filter 'LiveSplit.Bridge.TestHost.exe' | Select-Object -First 1
          if (-not $testhost) { throw 'TestHost executable was not found' }
          python cpp/tools/run_testhost.py --testhost $testhost.FullName --test-exe cpp/build/ci/divergencesplitter_testhost_tests.exe --port 54000
          if ($LASTEXITCODE -ne 0) { throw "TestHost integration failed: $LASTEXITCODE" }
      - name: Package ZIP
        run: cmake --build --preset ci --target package

      - name: Verify extracted ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/ci/*.zip | Select-Object -First 1
          if (-not $zip) { throw 'No ZIP package was produced' }
          $destination = Join-Path $env:RUNNER_TEMP 'divergencesplitter-zip'
          Expand-Archive -Path $zip.FullName -DestinationPath $destination
          foreach ($file in @('platforms\qwindows.dll', 'Qt6Core.dll', 'opencv_core4.dll', 'vc_redist.x64.exe', 'LICENSE.txt', 'licenses\qtbase.txt')) {
            if (-not (Test-Path (Join-Path $destination $file))) {
              throw "Extracted ZIP is missing $file"
            }
          }
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:PATH = "$destination;$env:SystemRoot\System32;$env:SystemRoot"
          & "$destination\divergencesplitter-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "CLI failed from extracted ZIP: $LASTEXITCODE" }
          $lock = Get-Content tools/ndi-sdk-lock.json -Raw | ConvertFrom-Json
          if ('${{ matrix.ndi }}' -eq 'ON') {
            $pinned = @{
              'Processing.NDI.Lib.x64.dll' = $lock.runtime_sha256
              'Processing.NDI.Lib.Licenses.txt' = $lock.runtime_licenses_sha256
            }
            foreach ($entry in $pinned.GetEnumerator()) {
              $file = Join-Path $destination $entry.Key
              if (-not (Test-Path $file) -or (Get-FileHash $file).Hash.ToLowerInvariant() -ne $entry.Value) {
                throw "ZIP is missing or has modified NDI redistribution file: $($entry.Key)"
              }
            }
            if (-not (Test-Path "$destination\licenses\NDI-TERMS.txt")) { throw 'NDI use terms missing' }
            Remove-Item Env:NDI_RUNTIME_DIR_V6 -ErrorAction SilentlyContinue
            Remove-Item Env:NDI_RUNTIME_DIR_V5 -ErrorAction SilentlyContinue
            & "$destination\divergencesplitter-cli.exe" --ndi-check
            if ($LASTEXITCODE -ne 0) { throw 'Extracted ZIP could not initialize its local NDI runtime' }
          } elseif (Test-Path "$destination\Processing.NDI.Lib.x64.dll") {
            throw 'SDK-disabled developer ZIP must not contain an NDI DLL'
          }
          if (Test-Path "$destination\licenses\ndi-sdk") { throw 'ZIP must not contain the SDK agreement directory' }
          $sdkContracts = Get-ChildItem $destination -Recurse -File -Filter '*.pdf' | Where-Object {
            $_.Name -match '(?i)ndi.*(license|agreement|eula)' -or
              (Get-FileHash $_.FullName).Hash.ToLowerInvariant() -eq $lock.agreement_sha256
          }
          if ($sdkContracts) { throw 'ZIP must not contain an NDI SDK contract PDF' }
          $developmentFiles = Get-ChildItem $destination -Recurse -File | Where-Object {
            $_.Extension -in '.h', '.hpp', '.lib' -or $_.Name -match '(?i)ndi.*(sdk|runtime).*\.exe$'
          }
          if ($developmentFiles) { throw 'ZIP contains SDK development files or installers' }
          $gui = Start-Process -FilePath "$destination\DivergenceSplitter.exe" -ArgumentList '--smoke-test' -WorkingDirectory $destination -WindowStyle Hidden -PassThru
          try {
            if (-not $gui.WaitForExit(10000)) { throw 'Extracted ZIP GUI smoke test timed out' }
            if ($gui.ExitCode -ne 0) { throw "Extracted ZIP GUI / NDI initialization failed: $($gui.ExitCode)" }
          } finally {
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force }
          }

      - name: Upload distribution
        if: matrix.ndi == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: DivergenceSplitter-cpp23-windows-x64
          path: cpp/build/ci/*.zip
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp23-tests-ndi-${{ matrix.ndi }}
          path: cpp/build/ci/ctest-results.xml
          if-no-files-found: warn
