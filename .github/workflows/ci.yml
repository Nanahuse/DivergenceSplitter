name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
      - name: Sync locked environment
        run: uv sync --locked --all-packages
      - name: Verify Bridge protocol authority
        run: |
          test -f external/LiveSplit.Bridge/proto/livesplit/bridge/v1/bridge.proto
          test -z "$(git ls-files packages/livesplit-bridge-client/src/livesplit)"
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run ty check --error-on-warning .
      - name: Test application
        run: uv run pytest -q
      - name: Test LiveSplit Bridge client
        run: uv run --package livesplit-bridge-client pytest -q packages/livesplit-bridge-client/tests
      - name: Build LiveSplit Bridge client
        run: uv build --package livesplit-bridge-client
