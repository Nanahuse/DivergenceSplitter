name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
      - name: Sync locked environment
        run: uv sync --locked --all-packages
      - name: Generate UI version module
        run: uv run python tools/generate_ui_version.py
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run ty check --error-on-warning .
      - name: Test
        run: uv run pytest -q

  ui-integration:
    # In-process Flet UI integration suite: real components, Flet controls, and
    # event flow with the external boundaries faked. Runs without Flutter or a
    # display, so it is the required, stable integration layer.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
      - name: Sync locked environment
        run: uv sync --locked --all-packages
      - name: Generate UI version module
        run: uv run python tools/generate_ui_version.py
      - name: Run UI integration tests
        working-directory: packages/divergencesplitter-ui
        run: uv run pytest integration_tests -q
