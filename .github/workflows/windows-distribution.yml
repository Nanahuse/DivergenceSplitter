name: Windows distribution

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
      - name: Cache Flutter and Flet
        uses: actions/cache@v6
        with:
          path: |
            ~/flutter/3.44.8
            ~/.flet/cache
          key: flet-build-windows-${{ runner.os }}-flet-1.0.0-flutter-3.44.8-py-3.14
      - name: Sync locked environment
        run: uv sync --locked --all-packages --group build
      - name: Check license inventory
        run: uv run --no-sync python tools/generate_ui_license_inventory.py --check
      - name: Generate UI version module
        run: uv run --no-sync python tools/generate_ui_version.py
      - name: Build and verify Windows distribution
        run: uv run --no-sync python tools/build_windows_distribution.py
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v7
        with:
          name: DivergenceSplitter-windows-x64
          path: dist/windows
          archive: true
          compression-level: 6
          if-no-files-found: error
